<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>國文總複習大冒險</title>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: M PLUS Rounded 1c for a friendly rounded style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"M PLUS Rounded 1c"', 'sans-serif'],
          },
          colors: {
            brand: {
              light: '#fdffb6',
              blue: '#9bf6ff',
              green: '#caffbf',
              purple: '#bdb2ff',
              pink: '#ffc6ff',
              orange: '#ffd6a5',
              red: '#ffadad'
            },
            ui: {
              dark: '#2b2d42',
              white: '#ffffff',
              gray: '#8d99ae'
            }
          },
          boxShadow: {
            'cartoon': '0 6px 0 rgba(43,45,66,1)',
            'cartoon-sm': '0 4px 0 rgba(43,45,66,1)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8edeb;
      /* Playful dotted background pattern */
      background-image:
        radial-gradient(#ffd6a5 20%, transparent 20%),
        radial-gradient(#ffd6a5 20%, transparent 20%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      overflow: hidden; /* Prevent body scroll, handle inside App */
    }

    /* Custom Scrollbar for inner containers */
    .custom-scrollbar::-webkit-scrollbar {
      width: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #8d99ae;
      border-radius: 8px;
      border: 2px solid white;
    }

    /* Animations */
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .animate-bounce-custom {
      animation: bounceCustom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes bounceCustom {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Button Press Effect */
    .btn-cartoon {
      transition: all 0.1s ease;
    }
    .btn-cartoon:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(43,45,66,1) !important;
    }
    
    .btn-cartoon-sm:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(43,45,66,1) !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 教材知識點題庫 ---
    const LEVELS = [
      {
        id: 1,
        title: '第一關：蓮花君子',
        subtitle: '第四課：愛蓮說',
        color: 'bg-brand-pink',
        questions: [
          {
            q: '「出淤泥而不染」象徵君子的哪一種品德？',
            options: ['潔身自愛，不同流合汙', '胸懷坦蕩，不結黨營私', '品德醇美，流芳遠播'],
            a: 0,
            exp: '蓮花從爛泥中長出卻不受汙染，象徵君子能在汙濁環境中潔身自愛。'
          },
          {
            q: '關於愛蓮說的寫作手法，下列何者正確？',
            options: ['用牡丹象徵隱士來陪襯', '以菊花反襯世人追求富貴', '藉牡丹反襯蓮花的高潔'],
            a: 2,
            exp: '作者藉牡丹象徵富貴，追慕者眾多，反襯蓮花高潔但愛蓮者卻甚少。'
          },
          {
            q: '「可遠觀而不可褻玩焉」象徵君子什麼特質？',
            options: ['為人正直不阿', '人格高潔讓人不敢輕慢', '節操高雅不媚俗'],
            a: 1,
            exp: '象徵君子高尚的人格令人敬仰，不敢輕慢戲弄。'
          }
        ]
      },
      {
        id: 2,
        title: '第二關：碎珠點滴',
        subtitle: '第五課：生命中的碎珠',
        color: 'bg-brand-blue',
        questions: [
          {
            q: '「生命中的碎珠」一文中，作者用什麼來比喻日常瑣事裡的空檔？',
            options: ['填滿空箱的細沙與清水', '沙裡淘金的過程', '海綿裡擠出的水'],
            a: 0,
            exp: '作者以空箱放入大小石頭、細沙、清水為喻，說明總有零星空隙可利用。'
          },
          {
            q: '歐陽脩的「三上」工夫不包含下列哪一個？',
            options: ['枕上', '廁上', '車上'],
            a: 2,
            exp: '歐陽脩善用零碎時間，他的「三上」為：馬上、枕上、廁上。'
          },
          {
            q: '胡適曾以哪一句話自勉，展現他善用時間的生活哲學？',
            options: ['一日不作，一日不食', '不做無益事，一日當三日', '寸金難買寸光陰'],
            a: 1,
            exp: '胡適以「不做無益事，一日當三日，人活五十歲，我活百五十」來自勉。'
          }
        ]
      },
      {
        id: 3,
        title: '第三關：鳥鳴頌歌',
        subtitle: '第六課：鳥',
        color: 'bg-brand-green',
        questions: [
          {
            q: '梁實秋在《鳥》一文中，認為什麼事情讓他感覺最不忍心？',
            options: ['鳥在天空中盤旋', '籠中鳥失去自由的苦悶', '聽不到鳥兒嘹亮的叫聲'],
            a: 1,
            exp: '看到籠子裡的鳥常年關在柵欄裡，撞頭碰壁，讓作者感到十分苦悶與不忍。'
          },
          {
            q: '作者形容鳥的身軀「細瘦而不乾癟，豐腴而不臃腫」，可對應哪個成語？',
            options: ['穠纖合度', '亭亭玉立', '玲瓏剔透'],
            a: 0,
            exp: '「穠纖合度」形容大小肥瘦都恰到好處，正是作者筆下鳥兒的完美體態。'
          },
          {
            q: '下列何者是作者用來描寫鳥類「聽覺」的優美摹寫？',
            options: ['一行白鷺上青天', '腳上像是有彈簧', '簡直是一派和諧的交響樂'],
            a: 2,
            exp: '「交響樂」是針對鳥囀聲音清脆嘹亮的多樣變化所作的聽覺摹寫。'
          }
        ]
      },
      {
        id: 4,
        title: '第四關：語法試煉',
        subtitle: '語文常識二：句子',
        color: 'bg-brand-purple',
        questions: [
          {
            q: '「故人西辭黃鶴樓。」這屬於哪一種基本句型？',
            options: ['敘事句', '有無句', '表態句'],
            a: 0,
            exp: '主語是「故人」，述語(一般動詞)是「辭」，賓語是「黃鶴樓」，為敘事句。'
          },
          {
            q: '「交友是一件有益的事。」這句話的句型是？',
            options: ['表態句', '有無句', '判斷句'],
            a: 2,
            exp: '包含繫詞「是」，用來判斷主語「交友」的屬性，為判斷句。'
          },
          {
            q: '下列哪一個句子屬於「表態句」？',
            options: ['山川壯麗，物產豐隆。', '天下無不散的筵席。', '學問為濟世之本。'],
            a: 0,
            exp: '「山川」(主語) + 「壯麗」(表語)，用來描寫事物的性質狀態，無一般動詞。'
          }
        ]
      }
    ];

    // --- Components ---

    // 1. 首頁畫面
    function HomeScreen({ onStart }) {
      return (
        <div className="flex flex-col items-center justify-center h-full p-8 text-center animate-bounce-custom">
          <div className="w-40 h-40 bg-brand-light rounded-full border-4 border-ui-dark flex items-center justify-center shadow-cartoon mb-8 animate-float">
            <i className="fa-solid fa-scroll text-6xl text-ui-dark"></i>
          </div>
          <h1 className="text-4xl md:text-5xl font-bold text-ui-dark mb-4 leading-snug tracking-wider">
            國文總複習<br/>大冒險
          </h1>
          <p className="text-2xl text-ui-gray mb-12 font-bold bg-gray-100 px-6 py-2 rounded-full border-2 border-ui-dark shadow-sm">
            愛蓮說 ‧ 碎珠 ‧ 鳥 ‧ 語法
          </p>
          <button 
            onClick={onStart}
            className="btn-cartoon px-10 py-4 bg-brand-pink text-ui-dark text-3xl font-bold rounded-full border-4 border-ui-dark shadow-cartoon flex items-center gap-4">
            <i className="fa-solid fa-play"></i> 開始闖關
          </button>
        </div>
      );
    }

    // 2. 地圖畫面
    function MapScreen({ unlockedLevel, stars, onSelectLevel }) {
      const totalStars = Object.values(stars).reduce((a, b) => a + b, 0);

      return (
        <div className="flex flex-col h-full bg-blue-50/50">
          {/* Header */}
          <div className="flex justify-between items-center bg-white border-b-4 border-ui-dark p-4 z-20 shadow-sm">
            <h2 className="text-2xl font-bold text-ui-dark flex items-center gap-3">
              <i className="fa-solid fa-map-location-dot text-brand-blue text-3xl"></i> 闖關地圖
            </h2>
            <div className="flex items-center gap-2 bg-brand-light px-4 py-2 rounded-xl border-4 border-ui-dark shadow-cartoon-sm">
              <i className="fa-solid fa-star text-brand-orange text-2xl animate-pulse"></i>
              <span className="text-2xl font-bold text-ui-dark">{totalStars}</span>
            </div>
          </div>

          {/* Map Area */}
          <div className="flex-1 overflow-y-auto custom-scrollbar p-6 relative">
            
            {/* 恭喜全破提示 */}
            {unlockedLevel > LEVELS.length && (
              <div className="bg-brand-green border-4 border-ui-dark rounded-2xl p-6 shadow-cartoon text-center max-w-md mx-auto mb-8 relative animate-bounce-custom">
                <h3 className="text-2xl font-bold text-ui-dark mb-2">🎉 恭喜破關！ 🎉</h3>
                <p className="font-bold text-ui-dark/80 text-lg">你已經精通這次的國文複習囉！</p>
              </div>
            )}

            <div className="relative w-full max-w-md mx-auto py-8">
              {/* Path Line (Vertical) */}
              <div className="absolute top-12 bottom-12 left-1/2 w-6 bg-brand-orange/40 -ml-3 rounded-full z-0"></div>

              {/* Levels Nodes */}
              <div className="flex flex-col gap-12 relative z-10">
                {LEVELS.map((level, idx) => {
                  const isUnlocked = level.id <= unlockedLevel;
                  const levelStars = stars[level.id] || 0;
                  const isLeft = idx % 2 === 0;

                  return (
                    <div key={level.id} className={`w-full flex ${isLeft ? 'justify-start' : 'justify-end'} px-4 md:px-12`}>
                      <div 
                        onClick={() => isUnlocked && onSelectLevel(level.id)}
                        className={`relative flex flex-col items-center w-32 ${!isUnlocked ? 'opacity-80 grayscale cursor-not-allowed' : 'cursor-pointer hover:scale-105 active:scale-95 transition-transform'}`}
                      >
                        {/* Node Bubble */}
                        <div className={`w-28 h-28 rounded-full border-4 border-ui-dark shadow-cartoon flex flex-col items-center justify-center ${isUnlocked ? level.color : 'bg-gray-300'}`}>
                          {!isUnlocked ? (
                            <i className="fa-solid fa-lock text-4xl text-ui-dark/50"></i>
                          ) : (
                            <span className="text-5xl font-bold text-ui-dark drop-shadow-md">{level.id}</span>
                          )}
                        </div>
                        
                        {/* Title Tag */}
                        <div className="mt-4 bg-white border-4 border-ui-dark rounded-xl px-3 py-2 shadow-cartoon-sm text-center w-40 absolute -bottom-12 z-20">
                          <div className="text-xs text-ui-gray font-bold mb-1">{level.subtitle}</div>
                          <div className="text-lg font-bold text-ui-dark leading-none">{level.title.split('：')[1]}</div>
                        </div>

                        {/* Stars Earned */}
                        {isUnlocked && levelStars > 0 && (
                           <div className="absolute -top-4 flex gap-1 bg-white/95 px-3 py-1 rounded-full border-4 border-ui-dark shadow-cartoon-sm z-20">
                              {[1,2,3].map(s => (
                                <i key={s} className={`fa-solid fa-star text-lg ${s <= levelStars ? 'text-brand-orange drop-shadow-sm' : 'text-gray-200'}`}></i>
                              ))}
                           </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 3. 關卡測驗畫面
    function LevelScreen({ level, onBack, onComplete }) {
      const [qIndex, setQIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [feedback, setFeedback] = useState(null); 
      const [showResult, setShowResult] = useState(false);

      const question = level.questions[qIndex];

      const handleOptionClick = (idx) => {
        if (feedback) return; 
        const isCorrect = idx === question.a;
        if (isCorrect) setScore(s => s + 1);
        setFeedback({ isCorrect, optionIdx: idx });
      };

      const handleNext = () => {
        setFeedback(null);
        if (qIndex + 1 < level.questions.length) {
          setQIndex(qIndex + 1);
        } else {
          setShowResult(true);
        }
      };

      // 關卡結算畫面
      if (showResult) {
        let earnedStars = score; // 滿分3題 = 3星
        return (
          <div className={`flex flex-col items-center justify-center h-full p-8 text-center animate-bounce-custom ${level.color}/20`}>
            <div className="bg-white border-4 border-ui-dark rounded-3xl p-8 shadow-cartoon w-full max-w-md">
              <h2 className="text-4xl font-bold text-ui-dark mb-6">關卡結算</h2>
              
              {/* 星星展示 */}
              <div className="flex justify-center gap-4 mb-8">
                {[1, 2, 3].map(s => (
                  <i key={s} className={`fa-solid fa-star text-6xl ${s <= earnedStars ? 'text-brand-orange animate-float drop-shadow-md' : 'text-gray-200'} `} style={{ animationDelay: `${s * 0.15}s` }}></i>
                ))}
              </div>
              
              <p className="text-3xl font-bold text-ui-dark mb-2">
                答對：{score} / {level.questions.length} 題
              </p>
              
              <p className="text-xl text-ui-gray font-bold mb-8">
                {score === 3 ? '完美過關！太強了！' : score >= 1 ? '表現不錯，繼續加油！' : '再試一次吧，你可以的！'}
              </p>

              <button 
                onClick={() => onComplete(level.id, earnedStars)}
                className="btn-cartoon w-full py-4 bg-brand-green text-ui-dark text-2xl font-bold rounded-2xl border-4 border-ui-dark shadow-cartoon">
                <i className="fa-solid fa-map"></i> 回到地圖
              </button>
            </div>
          </div>
        );
      }

      // 測驗進行中畫面
      return (
        <div className="flex flex-col h-full bg-white relative">
          
          {/* Header */}
          <div className={`p-4 ${level.color} border-b-4 border-ui-dark flex items-center justify-between z-10`}>
            <button onClick={onBack} className="btn-cartoon-sm w-12 h-12 bg-white rounded-full border-4 border-ui-dark flex items-center justify-center shadow-cartoon-sm">
              <i className="fa-solid fa-arrow-left text-2xl text-ui-dark"></i>
            </button>
            <h2 className="text-2xl font-bold text-ui-dark truncate max-w-[60%] tracking-wide">{level.title}</h2>
            <div className="bg-white px-4 py-2 rounded-full border-4 border-ui-dark font-bold text-ui-dark shadow-cartoon-sm text-lg">
              {qIndex + 1} / {level.questions.length}
            </div>
          </div>

          {/* Progress Bar */}
          <div className="h-4 w-full bg-gray-200 border-b-4 border-ui-dark">
            <div 
              className="h-full bg-brand-orange transition-all duration-500 ease-out"
              style={{ width: `${((qIndex) / level.questions.length) * 100}%` }}
            ></div>
          </div>

          {/* Question & Options */}
          <div className="flex-1 p-6 flex flex-col overflow-y-auto custom-scrollbar bg-gray-50/50">
            
            {/* Question Card */}
            <div className="bg-white border-4 border-ui-dark rounded-3xl p-6 shadow-cartoon mb-8 relative">
              <div className="absolute -top-5 left-6 bg-brand-light border-4 border-ui-dark rounded-full px-4 py-1 font-bold text-ui-dark shadow-sm text-xl">
                第 {qIndex + 1} 題
              </div>
              <h3 className="text-3xl md:text-4xl font-bold text-ui-dark leading-relaxed mt-4">
                {question.q}
              </h3>
            </div>

            {/* Options List */}
            <div className="flex flex-col gap-5 pb-32">
              {question.options.map((opt, idx) => {
                let btnClass = "bg-white hover:bg-brand-orange/20";
                let icon = null;
                
                if (feedback) {
                  if (idx === question.a) {
                    btnClass = "bg-brand-green text-ui-dark";
                    icon = <i className="fa-solid fa-circle-check text-3xl text-green-700 ml-auto animate-bounce-custom"></i>;
                  } else if (idx === feedback.optionIdx && !feedback.isCorrect) {
                    btnClass = "bg-brand-red text-ui-dark opacity-90";
                    icon = <i className="fa-solid fa-circle-xmark text-3xl text-red-700 ml-auto"></i>;
                  } else {
                    btnClass = "bg-gray-100 opacity-50";
                  }
                }

                return (
                  <button 
                    key={idx}
                    onClick={() => handleOptionClick(idx)}
                    disabled={feedback !== null}
                    className={`flex items-center text-left p-4 md:p-6 rounded-2xl border-4 border-ui-dark shadow-cartoon transition-all duration-200 font-bold text-2xl md:text-3xl text-ui-dark ${btnClass} ${!feedback ? 'active:translate-y-1 active:shadow-[0_2px_0_rgba(43,45,66,1)]' : ''}`}
                  >
                    <span className="w-12 h-12 flex-shrink-0 bg-white border-4 border-ui-dark rounded-full flex items-center justify-center mr-4 shadow-sm text-2xl">
                      {['A', 'B', 'C'][idx]}
                    </span>
                    <span className="flex-1 leading-snug">{opt}</span>
                    {icon}
                  </button>
                )
              })}
            </div>
          </div>

          {/* Feedback Popup Panel */}
          {feedback && (
            <div className="absolute bottom-0 left-0 right-0 p-6 bg-white border-t-4 border-ui-dark rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.15)] animate-[bounceCustom_0.4s_ease-out] z-30">
               <div className="flex items-start gap-5 mb-6">
                  <div className={`w-16 h-16 rounded-full border-4 border-ui-dark flex items-center justify-center flex-shrink-0 shadow-cartoon-sm ${feedback.isCorrect ? 'bg-brand-green' : 'bg-brand-red'}`}>
                     <i className={`fa-solid text-4xl text-ui-dark ${feedback.isCorrect ? 'fa-check' : 'fa-xmark'}`}></i>
                  </div>
                  <div>
                    <h4 className={`text-3xl font-bold mb-3 ${feedback.isCorrect ? 'text-green-700' : 'text-red-700'}`}>
                      {feedback.isCorrect ? '太棒了！答對囉！' : '哎呀！答錯囉！'}
                    </h4>
                    <p className="text-2xl font-bold text-ui-dark leading-relaxed">
                      {question.exp}
                    </p>
                  </div>
               </div>
               <button 
                 onClick={handleNext}
                 className="w-full btn-cartoon py-4 bg-brand-blue text-ui-dark text-2xl font-bold rounded-2xl border-4 border-ui-dark shadow-cartoon">
                 {qIndex + 1 < level.questions.length ? '下一題 ➔' : '查看成績 🏆'}
               </button>
            </div>
          )}
        </div>
      );
    }

    // --- Main App Controller ---
    function App() {
      const [screen, setScreen] = useState('HOME'); 
      const [unlockedLevel, setUnlockedLevel] = useState(1);
      const [stars, setStars] = useState({});
      const [currentLevelId, setCurrentLevelId] = useState(null);

      const startAdventure = () => {
        setScreen('MAP');
      };

      const openLevel = (id) => {
        setCurrentLevelId(id);
        setScreen('LEVEL');
      };

      const completeLevel = (id, earnedStars) => {
        // Update highest stars
        setStars(prev => ({
          ...prev,
          [id]: Math.max(prev[id] || 0, earnedStars) 
        }));
        
        // Unlock next level if they attempted and finished
        if (id === unlockedLevel && id < LEVELS.length) {
          setUnlockedLevel(id + 1);
        }
        setScreen('MAP');
      };

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-2 sm:p-6 w-full">
          {/* Main App Container */}
          <div className="w-full max-w-2xl bg-white rounded-[2rem] border-4 border-ui-dark shadow-[0_12px_0_rgba(43,45,66,1)] overflow-hidden flex flex-col h-[95vh] sm:h-[85vh] relative">
            
            {screen === 'HOME' && <HomeScreen onStart={startAdventure} />}
            
            {screen === 'MAP' && (
              <MapScreen 
                unlockedLevel={unlockedLevel} 
                stars={stars} 
                onSelectLevel={openLevel} 
              />
            )}
            
            {screen === 'LEVEL' && (
              <LevelScreen 
                level={LEVELS.find(l => l.id === currentLevelId)} 
                onBack={() => setScreen('MAP')}
                onComplete={completeLevel}
              />
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
